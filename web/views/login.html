<section class="card narrow">
  <h1>{{vm.mode === 'login' ? 'Welcome back' : 'Join RideMatch'}}</h1>
  <form ng-submit="vm.submit()" class="stack">
    <input ng-if="vm.mode === 'register'" ng-model="vm.form.name" placeholder="Your name" required>
    <input type="email" ng-model="vm.form.email" placeholder="Email" required>
    <input type="password" ng-model="vm.form.password" placeholder="Password (8+ characters)" required minlength="8">
    <button class="primary">{{vm.mode === 'login' ? 'Log in' : 'Create account'}}</button>
  </form>
  <p ng-if="vm.mode === 'login'">New here? <a href ng-click="vm.mode = 'register'">Create an account</a></p>
  <p ng-if="vm.mode === 'register'">Have an account? <a href ng-click="vm.mode = 'login'">Log in</a></p>
</section>
